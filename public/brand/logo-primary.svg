<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Pratham Aalo primary logo — sun over Bengal fields">
  <defs>
    <linearGradient id="sun" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8C3E20"/><stop offset=".55" stop-color="#B0512C"/><stop offset="1" stop-color="#C99A3C"/>
    </linearGradient>
  </defs>
  <!-- kantha-stitched rays: short dashes, hand rhythm -->
  <g fill="none" stroke-linecap="round" stroke="url(#sun)">
    <g stroke-width="2.2" opacity="0.9">
      <path d="M160 52 l-6 -12" stroke-dasharray="3 4"/>
      <path d="M180 46 l-2 -13" stroke-dasharray="3 4"/>
      <path d="M201 46 l2 -13" stroke-dasharray="3 4"/>
      <path d="M221 52 l6 -12" stroke-dasharray="3 4"/>
    </g>
    <!-- rising sun: hand-drawn double arc, open at horizon -->
    <path d="M138 108 A52 52 0 0 1 242 108" stroke-width="3" opacity="0.95"/>
    <path d="M147 108 A43 43 0 0 1 233 108" stroke-width="1.4" opacity="0.6"/>
    <path d="M138 108 A52 52 0 0 1 242 108 Z" fill="url(#sun)" stroke="none" opacity="0.16"/>
    <!-- seed-photons: three dots sown above the sun -->
    <circle cx="168" cy="30" r="1.8" fill="#8C3E20" stroke="none" opacity="0.7"/>
    <circle cx="190" cy="24" r="2.2" fill="#B0512C" stroke="none" opacity="0.8"/>
    <circle cx="212" cy="30" r="1.8" fill="#C99A3C" stroke="none" opacity="0.8"/>
    <!-- field furrows: three terraced horizons, Bengal delta -->
    <path d="M48 122 C 120 114, 260 114, 332 122" stroke="#2B2F6B" stroke-width="2.6" opacity="0.85"/>
    <path d="M64 134 C 130 127, 250 127, 316 134" stroke="#2B2F6B" stroke-width="1.3" opacity="0.45"/>
    <path d="M84 144 C 140 138, 240 138, 296 144" stroke="#2B2F6B" stroke-width="1" opacity="0.28"/>
    <!-- river: one meandering line through the fields -->
    <path d="M176 122 C 170 128, 186 132, 178 138 C 172 143, 182 146, 179 150" stroke="#7FA8A0" stroke-width="1.6" opacity="0.9"/>
    <!-- two rice seedlings -->
    <g stroke="#5F7F5E" stroke-width="1.4" opacity="0.85">
      <path d="M104 122 c 0 -7, -4 -10, -8 -12 M104 122 c 0 -7, 4 -10, 8 -12 M104 122 L104 112"/>
      <path d="M276 122 c 0 -7, -4 -10, -8 -12 M276 122 c 0 -7, 4 -10, 8 -12 M276 122 L276 112"/>
    </g>
  </g>
  <text x="190" y="188" text-anchor="middle" font-family="'Noto Serif Bengali','Tiro Bangla',serif" font-size="34" font-weight="600" fill="#26211A" letter-spacing="0.5">প্রথম আলো</text>
  <text x="190" y="212" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" letter-spacing="5" fill="#6F665A">PRATHAM AALO</text>
</svg>
